<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Harmony Helix (Reversed Helix)</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #fff; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px; font-size: 14px; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
</head>
<body>
  <div id="info">
    <h3 style="margin:0 0 8px 0;">3D Harmony Helix (逆回転)</h3>
    <div>・螺旋1周 = 7和音（上下で位置重複）</div>
    <div>・<span style="color:#4dabf7;">■</span> K_dur / K_moll_natural</div>
    <div>・<span style="color:#ff6b6b;">■</span> K_moll_harmonic</div>
    <div>・<span style="color:#ffd43b;">●</span> aug / dim (螺旋外側にオフセット)</div>
  </div>
  <div id="canvas-container"></div>

  <script>
    const csvData = `,main,C,A,F,D,Bb,G,Eb,C,G#,F,C#,Bb,F#,D#,B,G#,E,C#,A,F#,D,B,G,E,C
,mode,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M,m,M
,name,C,Am,F,Dm,Bb,Gm,Eb,Cm,G#,Fm,C#,Bbm,F#,D#m,B,G#m,E,C#m,A,F#m,D,Bm,G,Em,C
,tone,CEG,ACE,FAC,DFA,A#DF,GA#D,D#GA#,CD#G,G#CD#,FG#C,C#FG#,A#C#F,F#A#C#,D#F#A#,BD#F#,G#BD#,EG#B,C#EG#,AC#E,F#AC#,DF#A,BDF#,GBD,EGB,CEG
,,,,,,,,,,,,,,,,,,,,,,,,,,,
"K_dur, K_moll_natural",C,◯,◯,◯,◯,,,,,,,,,,,,,,,,dim,◯,◯,◯
,F,◯,◯,◯,◯,◯,◯,,,,,,,,,,,,,,,,,dim,◯
,Bb,,dim,◯,◯,◯,◯,◯,◯,,,,,,,,,,,,,,,,
,Eb,,,,dim,◯,◯,◯,◯,◯,◯,,,,,,,,,,,,,,
,Ab,,,,,,dim,◯,◯,◯,◯,◯,◯,,,,,,,,,,,,
,Db,,,,,,,,dim,◯,◯,◯,◯,◯,◯,,,,,,,,,,
,Gb,,,,,,,,,,dim,◯,◯,◯,◯,◯,◯,,,,,,,,
,B,,,,,,,,,,,,dim,◯,◯,◯,◯,◯,◯,,,,,,
,E,,,,,,,,,,,,,,dim,◯,◯,◯,◯,◯,◯,,,,
,A,,,,,,,,,,,,,,,,dim,◯,◯,◯,◯,◯,◯,,
,D,,,,,,,,,,,,,,,,,,dim,◯,◯,◯,◯,◯,◯
,G,◯,◯,,,,,,,,,,,,,,,,dim,◯,◯,◯,◯,◯
K_moll_harmonic,A,aug,◯,◯,◯,,,,,,,,,,,,dim,◯,,,,dim,,,aug
,D,,,aug,◯,◯,◯,,,,,,,,,,,,dim,◯,,,,dim,
,G,,,,,aug,◯,◯,◯,,,,,,,,,,,,dim,◯,,,
,C,,,,,,,aug,◯,◯,◯,,,,,,,,,,,,dim,◯,,
,F,◯,,,,,,,,aug,◯,◯,◯,,,,,,,,,,,,dim,◯
,Bb,,dim,◯,,,,,,,,aug,◯,◯,◯,,,,,,,,,,
,Eb,,,,dim,◯,,,,,,,,aug,◯,◯,◯,,,,,,,,
,Ab,,,,,,dim,◯,,,,,,,,aug,◯,◯,◯,,,,,,
,Db,,,,,,,,dim,◯,,,,,,,,aug,◯,◯,◯,,,,
,Gb,,,,,,,,,,dim,◯,,,,,,,,aug,◯,◯,◯,,
,B,,,,,,,,,,,,dim,◯,,,,,,,,aug,◯,◯,◯
,E,◯,◯,,,,,,,,,,,,dim,◯,,,,,,,,aug,◯,◯`;

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(-22, 15, 32); // カメラ視点を反対側に調整

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(-15, 30, 15);
    scene.add(pointLight);

    Papa.parse(csvData, {
      header: false,
      complete: function(results) {
        build3DModel(results.data);
      }
    });

    function build3DModel(data) {
      const nameRowIndex = data.findIndex(row => row[1] === 'name');
      if (nameRowIndex === -1) return;

      const chordNames = data[nameRowIndex].slice(2);
      const numChords = chordNames.length;

      const radius = 9;
      const heightStep = 1.3;
      const period = 7;
      const chordNodes = [];

      function createTextSprite(text, color = "#ffffff", bg = "rgba(0,0,0,0.6)") {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'Bold 42px Arial';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(3, 1.5, 1);
        return sprite;
      }

      // 螺旋ノードの配置（角度計算にマイナスを付与して回転方向を反転）
      chordNames.forEach((name, i) => {
        const angle = -((i % period) * (Math.PI * 2 / period));
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        const y = i * heightStep - (numChords * heightStep / 2);

        const pos = new THREE.Vector3(x, y, z);
        chordNodes.push({ name: name, pos: pos, index: i });

        const geo = new THREE.SphereGeometry(0.45, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0x4dd0e1, roughness: 0.2 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        scene.add(mesh);

        const sprite = createTextSprite(name, "#ffffff");
        sprite.position.copy(pos).add(new THREE.Vector3(0, 0.85, 0));
        scene.add(sprite);
      });

      // 螺旋ガイドライン
      const curvePoints = chordNodes.map(n => n.pos);
      const curve = new THREE.CatmullRomCurve3(curvePoints);
      const tubeGeo = new THREE.TubeGeometry(curve, 120, 0.04, 8, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0x666666, opacity: 0.3, transparent: true });
      scene.add(new THREE.Mesh(tubeGeo, tubeMat));

      // キーと接続線の描画
      const durColor = 0x4dabf7;
      const harmonicColor = 0xff6b6b;
      const augDimColor = 0xffd43b;

      data.forEach((row, rIdx) => {
        const keyName = row[1];
        if (!keyName || rIdx < 5) return;

        const lineGroupColor = (rIdx >= 17) ? harmonicColor : durColor;
        const keyNodes = [];

        for (let c = 2; c < row.length; c++) {
          const val = row[c];
          if (!val || c - 2 >= chordNodes.length) continue;

          const basePos = chordNodes[c - 2].pos.clone();

          if (val === '◯') {
            keyNodes.push(basePos);
          } else if (val === 'aug' || val === 'dim') {
            const dir = new THREE.Vector3(basePos.x, 0, basePos.z).normalize();
            const offsetPos = basePos.clone().add(dir.multiplyScalar(2.2));

            const extraGeo = new THREE.SphereGeometry(0.25, 12, 12);
            const extraMat = new THREE.MeshBasicMaterial({ color: augDimColor });
            const extraMesh = new THREE.Mesh(extraGeo, extraMat);
            extraMesh.position.copy(offsetPos);
            scene.add(extraMesh);

            const extraSprite = createTextSprite(`${keyName}:${val}`, "#ffd43b", "rgba(40,40
