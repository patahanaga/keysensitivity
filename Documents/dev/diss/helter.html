<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3D Harmony Helix</title>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0d1117; color: #fff; font-family: sans-serif; }
    #info { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; }
    #canvas-container { width: 100vw; height: 100vh; }
  </style>
  <!-- Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- PapaParse for CSV Parsing -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body>
  <div id="info">
    <h2>3D Harmony Helix</h2>
    <p>・螺旋1周 = 7和音（真上に積み重なる構造）</p>
    <p>・<span style="color:#4dabf7;">■</span> K_dur / K_moll_natural</p>
    <p>・<span style="color:#ff6b6b;">■</span> K_moll_harmonic</p>
    <p>・<span style="color:#ffd43b;">●</span> aug / dim (螺旋からオフセット表示)</p>
  </div>
  <div id="canvas-container"></div>

  <script>
    // --- 1. Three.js セットアップ ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.015);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 20, 30);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 光源
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    const pointLight = new THREE.PointLight(0xffffff, 1);
    pointLight.position.set(10, 20, 10);
    scene.add(pointLight);

    // --- 2. CSV読み込みとデータ構築 ---
    Papa.parse('harmony_ichiran.csv', {
      download: true,
      header: false,
      complete: function(results) {
        build3DModel(results.data);
      }
    });

    function build3DModel(data) {
      // データの解析
      const nameRowIndex = data.findIndex(row => row[1] === 'name');
      if (nameRowIndex === -1) return;

      const chordNames = data[nameRowIndex].slice(2); // 2列目以降が和音名
      const numChords = chordNames.length;

      // 螺旋パラメータ
      const radius = 8;
      const heightStep = 1.2;
      const period = 7; // 7周で1重なる
      const chordNodes = []; // インデックスごとの3D位置保持

      // 3Dテキスト/ラベル作成用のキャンバス生成関数
      function createTextSprite(text, color = "#ffffff", bg = "rgba(0,0,0,0.6)") {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 128;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = 'Bold 44px Arial';
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, 128, 64);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMaterial = new THREE.SpriteMaterial({ map: texture });
        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(3, 1.5, 1);
        return sprite;
      }

      // --- 3. 和音（ノード）の螺旋配置 ---
      chordNames.forEach((name, i) => {
        const angle = (i % period) * (Math.PI * 2 / period);
        const x = radius * Math.cos(angle);
        const z = radius * Math.sin(angle);
        const y = i * heightStep - (numChords * heightStep / 2);

        const pos = new THREE.Vector3(x, y, z);
        chordNodes.push({ name: name, pos: pos, index: i });

        // メッシュ描画（和音の球体）
        const geo = new THREE.SphereGeometry(0.4, 16, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0x4dd0e1, roughness: 0.3 });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.copy(pos);
        scene.add(mesh);

        // ラベル表示
        const sprite = createTextSprite(name, "#ffffff");
        sprite.position.copy(pos).add(new THREE.Vector3(0, 0.8, 0));
        scene.add(sprite);
      });

      // 螺旋の基準ガイドライン
      const curvePoints = chordNodes.map(n => n.pos);
      const curve = new THREE.CatmullRomCurve3(curvePoints);
      const tubeGeo = new THREE.TubeGeometry(curve, 100, 0.05, 8, false);
      const tubeMat = new THREE.MeshBasicMaterial({ color: 0x555555, opacity: 0.3, transparent: true });
      scene.add(new THREE.Mesh(tubeGeo, tubeMat));

      // --- 4. 調（Key）による和音間の接続描画 ---
      const durColor = 0x4dabf7;     // Dur / Moll Naturalのライン色
      const harmonicColor = 0xff6b6b; // Moll Harmonicのライン色
      const augDimColor = 0xffd43b;  // aug/dim用カラー

      data.forEach((row, rIdx) => {
        const category = row[0]; // K_dur, K_moll_natural や K_moll_harmonic
        const keyName = row[1];
        if (!keyName || rIdx < 5) return;

        let lineGroupColor = durColor;
        if (rIdx >= 17) { lineGroupColor = harmonicColor; } // 17行目以降がHarmonic

        const keyNodes = [];

        // 列ごとにセルを走査
        for (let c = 2; c < row.length; c++) {
          const val = row[c];
          if (!val) continue;

          const basePos = chordNodes[c - 2].pos.clone();

          if (val === '◯') {
            keyNodes.push(basePos);
          } else if (val === 'aug' || val === 'dim') {
            // aug, dim は螺旋の外側（半径方向）にシフトした位置に分岐ノードを作成
            const dir = new THREE.Vector3(basePos.x, 0, basePos.z).normalize();
            const offsetPos = basePos.clone().add(dir.multiplyScalar(2.0));

            // 点を描画
            const extraGeo = new THREE.SphereGeometry(0.2, 12, 12);
            const extraMat = new THREE.MeshBasicMaterial({ color: augDimColor });
            const extraMesh = new THREE.Mesh(extraGeo, extraMat);
            extraMesh.position.copy(offsetPos);
            scene.add(extraMesh);

            // ラベル
            const extraSprite = createTextSprite(`${keyName}:${val}`, "#ffd43b", "rgba(50,50,0,0.7)");
            extraSprite.scale.set(2.5, 1.2, 1);
            extraSprite.position.copy(offsetPos).add(new THREE.Vector3(0, 0.5, 0));
            scene.add(extraSprite);

            // 元の和音とaug/dimノードを点線で結ぶ
            const linkGeo = new THREE.BufferGeometry().setFromPoints([basePos, offsetPos]);
            const linkMat = new THREE.LineDashedMaterial({ color: augDimColor, dashSize: 0.2, gapSize: 0.1 });
            const linkLine = new THREE.Line(linkGeo, linkMat);
            linkLine.computeLineDistances();
            scene.add(linkLine);

            keyNodes.push(offsetPos);
          }
        }

        // 調に属するノード同士を結ぶ（ポリライン描画）
        if (keyNodes.length > 1) {
          const lineGeo = new THREE.BufferGeometry().setFromPoints(keyNodes);
          const lineMat = new THREE.LineBasicMaterial({
            color: lineGroupColor,
            linewidth: 2,
            transparent: true,
            opacity: 0.7
          });
          const polyLine = new THREE.Line(lineGeo, lineMat);
          scene.add(polyLine);
        }
      });
    }

    // --- 5. アニメーションループ & リサイズ対応 ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
